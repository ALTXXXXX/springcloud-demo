spring:
  cloud:
    gateway:
      routes:
        - id: order-route
          uri: lb://service-order
          predicates:
            - Path=/api/order/**
          order: 0
        - id: product-route
          uri: https://cn.bing.com/
          predicates:
            - name: Path
              args:
                pattern: /search
                matchTrailingSlash: true
            - name: Query
              args:
                param: q
                regexp: haha
            - name: Vip
              args:
                param: user
                value: leifengyang
        - id: bin-route
          uri: https://cn .bing.com/
          predicates:
            - Path=/**
